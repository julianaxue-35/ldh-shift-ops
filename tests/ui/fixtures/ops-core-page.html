<!doctype html>
<!-- Minimal host page for lib/ops-core.js's own tests (tests/ui/ops-core.test.js).
     Not a real dashboard page — just enough DOM/CSS tokens for OpsCore to
     render its login screen, passcode modal and nav row into. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpsCore test page</title>
<style>
  :root {
    --bg: #F4F6FB; --card-bg: #FFFFFF; --border: rgba(30,34,56,0.10);
    --ink: #1E2238; --muted: #6B7280; --critical: #D03B3B; --amber: #FF9F43;
    --shadow-card: 0 2px 6px rgba(30,34,56,0.06);
  }
  body { font-family: sans-serif; }
</style>
</head>
<body>
<div id="ops-nav"></div>
<div id="app" style="display:none;">Signed in</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../../lib/ops-core.js"></script>
<script>
  window.__opsInit = OpsCore.init({ page: 'vets' }).then(({ sb, session }) => {
    window.__opsSession = session;
    window.__opsSb = sb;
    document.getElementById('app').style.display = 'block';
  });
</script>
</body>
</html>
